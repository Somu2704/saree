version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: saree-postgres
    environment:
      POSTGRES_DB: saree
      POSTGRES_USER: saree
      POSTGRES_PASSWORD: saree
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: saree-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: saree-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data:
